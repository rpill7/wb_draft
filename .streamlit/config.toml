[theme]
base = "light"
primaryColor = "#1D4E89"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2430"
linkColor = "#1D4E89"
borderColor = "#E3E8EF"

# Streamlit 1.66 reads this section for the sidebar on its own.
[theme.sidebar]
backgroundColor = "#0B1F3A"
secondaryBackgroundColor = "#143056"
textColor = "#F4F7FB"
primaryColor = "#3B82F6"
linkColor = "#93C5FD"
borderColor = "#1E3A5F"

[server]
headless = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

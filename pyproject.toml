[project]
name = "ma-engine"
version = "0.1.0"
description = "M&A acquirer identification engine"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pydantic",
    "python-dotenv",
    "fastmcp",
    "openai",
    "streamlit",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ma_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
